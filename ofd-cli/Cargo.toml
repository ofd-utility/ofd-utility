[package]
name = "ofd-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Command-line tool to inspect, validate and render OFD (GB/T 33190-2016) files"

[[bin]]
name = "ofd-cli"
path = "src/main.rs"

[dependencies]
# version 是发布到 crates.io 的硬性要求（纯 path 依赖会被拒绝）；本地构建仍走
# path，version 只在发布后对下游生效。每次提升 ofd-core 版本需同步这里。
ofd-core = { path = "../ofd-core", version = "0.3" }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# 集成测试：assert_cmd 驱动真实二进制，tempfile/zip 构造 .ofd 夹具。
assert_cmd = "2"
predicates = "3"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
