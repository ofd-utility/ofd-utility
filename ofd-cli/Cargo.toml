[package]
name = "ofd-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[[bin]]
name = "ofd-cli"
path = "src/main.rs"

[dependencies]
ofd-core = { path = "../ofd-core" }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
